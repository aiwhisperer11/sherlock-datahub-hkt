[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-engine"
version = "0.1.0"
description = "Evidence-driven investigation engine for DataHub incidents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "jsonschema>=4.25,<5",
  "mcp>=1.0,<2.0",
  "pydantic>=2.9,<3.0",
  "starlette>=0.40,<1.0",
  "uv>=0.11,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.15,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sherlock = ["connectors/datahub/fixtures/*.json", "connectors/sandbox/fixtures/*.json"]
